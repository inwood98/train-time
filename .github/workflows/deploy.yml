name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # Refresh cadence. Every 30 min stays comfortably within the free
    # Actions quota; lower it (e.g. */15) for fresher data if you prefer.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # npm run build triggers the prebuild hook, which fetches a fresh
      # snapshot of both directions into public/data/departures.json
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4